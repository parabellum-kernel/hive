name: Release Hive Binaries

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  ZIG_VERSION: "0.17.1"

jobs:
  build-and-release:
    name: ${{ matrix.asset_suffix }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-linux-gnu
            asset_suffix: linux-x86_64
            bin_name: hive
            asset_name: hive-linux-x86_64
          # Deshabilitados temporalmente hasta completar el soporte de plataforma
          # - os: macos-14
          #   target: aarch64-macos
          #   asset_suffix: macos-aarch64
          #   bin_name: hive
          #   asset_name: hive-macos-aarch64
          # - os: windows-latest
          #   target: x86_64-windows-gnu
          #   asset_suffix: windows-x86_64
          #   bin_name: hive.exe
          #   asset_name: hive-windows-x86_64.exe
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout hive
        uses: actions/checkout@v4
        with:
          path: hive

      - name: Checkout engine (private)
        uses: actions/checkout@v4
        with:
          repository: parabellum-kernel/engine
          token: ${{ secrets.RELEASE_PUSH_TOKEN }}
          path: engine

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ vars.ZIG_VERSION || env.ZIG_VERSION }}

      - name: Install SQLite dev headers (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev

      - name: Test
        working-directory: hive
        run: zig build test

      - name: Build release artifacts
        working-directory: hive
        shell: bash
        run: |
          zig build -Dtarget=${{ matrix.target }} -Doptimize=ReleaseSafe
          cp "zig-out/bin/${{ matrix.bin_name }}" "${{ matrix.asset_name }}"

      - name: Publish assets to GitHub Releases
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: hive/${{ matrix.asset_name }}
