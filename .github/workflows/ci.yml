name: CI

on:
  workflow_dispatch:
  workflow_call:

env:
  ZIG_VERSION: "0.17.1"

jobs:
  test:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
            build_cmd: ./scripts/build-linux.sh
          - name: macos-aarch64
            os: macos-15
            build_cmd: ./scripts/build-macos.sh
          # Deshabilitado temporalmente hasta completar el soporte de plataforma
          # - name: windows-x86_64
          #   os: windows-latest
          #   build_cmd: pwsh -File ./scripts/build-windows.ps1
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout hive
        uses: actions/checkout@v4
        with:
          path: hive

      - name: Checkout engine (private)
        uses: actions/checkout@v4
        with:
          repository: parabellum-kernel/engine
          token: ${{ secrets.RELEASE_PUSH_TOKEN }}
          path: engine

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ vars.ZIG_VERSION || env.ZIG_VERSION }}

      - name: Build & Test
        working-directory: hive
        shell: bash
        run: |
          ${{ matrix.build_cmd }}
          zig build test
